name: CI

# Free and unlimited: GitHub-hosted runners cost nothing on public repositories.
#
# Why this exists: on the night of 17-18 August a JavaScript temporal-dead-zone
# crash shipped to the live site and silently broke admin sign-in whenever the
# desk was reached by a direct link. It was found by walking into it. That is
# the bug class this catches.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Engine tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the guardrail and engine tests
        run: python -m pytest -q

      # The engine must stay runnable with no model key at all. If this breaks,
      # the deterministic mock path has rotted and the demo cannot be reproduced.
      - name: Prove the engine still runs in mock mode with no API key
        env:
          YAAD_API_KEY: ""
        run: python run_demo.py > /dev/null

  edge-functions:
    name: Edge Function typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # These four functions are deployed by hand. Typechecking them here is the
      # only thing standing between a typo and a broken production endpoint.
      - name: Typecheck every Edge Function
        run: |
          set -e
          for d in supabase/functions/yaad-*; do
            echo "::group::$d"
            deno check "$d/index.ts"
            echo "::endgroup::"
          done

      # Shared modules are copied into each function directory because Supabase
      # deploys self-contained bundles. If a copy drifts from _shared, the thing
      # you tested is not the thing you deployed.
      #
      # The check keys off whether a function actually imports the file, not
      # whether one happens to be sitting there. An early version compared every
      # yaad-* directory against _shared, so yaad-match, which has no otel import
      # and correctly carries no copy, failed every run from the day it was
      # added. Keying off the import also catches the opposite mistake: a stale
      # copy left behind in a function that no longer imports it.
      #
      # Loops over every file in _shared rather than naming otel.ts, so adding a
      # shared module does not mean remembering to extend this job. textmodel.ts
      # was the second one and it decides which country the text model calls go
      # to, which is not a thing to leave unenforced.
      - name: Check the shared module copies are in sync
        run: |
          set -e
          fail=0
          for shared in supabase/functions/_shared/*.ts; do
            name=$(basename "$shared")
            for d in supabase/functions/yaad-*; do
              [ -f "$d/index.ts" ] || continue
              if grep -q "from \"./$name\"" "$d/index.ts"; then
                if [ ! -f "$d/$name" ]; then
                  echo "::error file=$d/index.ts::imports ./$name but no copy is present. Run supabase/functions/sync-shared.sh"
                  fail=1
                elif ! cmp -s "$shared" "$d/$name"; then
                  echo "::error file=$d/$name::$name has drifted from _shared/$name. Run supabase/functions/sync-shared.sh"
                  fail=1
                fi
              elif [ -f "$d/$name" ]; then
                echo "::error file=$d/$name::$name is here but nothing imports it. Delete it, or import it."
                fail=1
              fi
            done
          done
          exit $fail

      # The provider decision lives in _shared/textmodel.ts and nowhere else.
      # A hard-coded model endpoint in a function is how the estate ended up on
      # eight copies of the same China URL, and how it would quietly drift back.
      - name: No function hard-codes a model endpoint
        run: |
          set -e
          hits=$(grep -rnE 'https://(api\.minimax\.io|api\.mistral\.ai)' \
            supabase/functions/yaad-*/index.ts || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::A text model endpoint is hard-coded in a function. Use pickTextProvider() from _shared/textmodel.ts."
            exit 1
          fi
          echo "No hard-coded text model endpoints."

  web:
    name: Web app (typecheck and tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      # Node 24 on purpose. tests/ import the app's real .ts files and rely on
      # Node stripping the types itself, which older Node cannot do. Drop this
      # below 22.18 and every test fails to parse rather than fails to pass.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # `npm run lint` is deliberately NOT run here yet. It currently reports a
      # pre-existing error in app/portal/join/page.tsx (react-hooks
      # set-state-in-effect) that predates this job. Adding lint today would
      # mean either a permanently red build, or quietly changing portal
      # behaviour to make an unrelated job go green. Fix that error, then add
      # `npm run lint` here in the same commit.

      # The tests that matter here are the negative ones: an unsigned, forged or
      # replayed request to /api/hubspot/stage must write NOTHING. That endpoint
      # is what stands between a forged webhook and a deal marked as funded, so
      # these run on every push rather than by hand. No network and no
      # credentials: HubSpot is stubbed.
      - name: Run the web tests
        run: npm test

      # `next build` is deliberately not run here. check-env.mjs stops a
      # production build without the Supabase values, which are secrets this
      # workflow has no reason to hold. Typecheck and lint already catch the
      # class of breakage a build would.

  secrets:
    name: No secrets committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # One API key has already been exposed and rotated on this project. This
      # is a cheap backstop, not a substitute for care.
      - name: Scan tracked files for key-shaped strings
        run: |
          set -e
          # Documentation placeholders (nvapi-xxxxxxxx, <your-key>) are not leaks.
          # Filtering them out is what keeps this check trustworthy: a scanner
          # that cries wolf is a scanner people start ignoring.
          matches=$(git grep -nIE \
            '(sk-[A-Za-z0-9_-]{16,}|nvapi-[A-Za-z0-9_-]{16,}|eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{10,})' \
            -- . ':!.github/workflows/ci.yml' \
            | grep -viE 'x{8,}|<[^>]*>|your[-_ ]?(api[-_ ]?)?(key|token|secret)|placeholder|example|redacted|\.\.\.' || true)
          if [ -n "$matches" ]; then
            echo "$matches"
            echo "::error::A string shaped like an API key or JWT is committed. Rotate it, then remove it."
            exit 1
          fi
          echo "No key-shaped strings found in tracked files."
