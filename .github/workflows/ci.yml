name: CI

# Free and unlimited: GitHub-hosted runners cost nothing on public repositories.
#
# Why this exists: on the night of 17-18 August a JavaScript temporal-dead-zone
# crash shipped to the live site and silently broke admin sign-in whenever the
# desk was reached by a direct link. It was found by walking into it. That is
# the bug class this catches.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Engine tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the guardrail and engine tests
        run: python -m pytest -q

      # The engine must stay runnable with no model key at all. If this breaks,
      # the deterministic mock path has rotted and the demo cannot be reproduced.
      - name: Prove the engine still runs in mock mode with no API key
        env:
          YAAD_API_KEY: ""
        run: python run_demo.py > /dev/null

  edge-functions:
    name: Edge Function typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # These four functions are deployed by hand. Typechecking them here is the
      # only thing standing between a typo and a broken production endpoint.
      - name: Typecheck every Edge Function
        run: |
          set -e
          for d in supabase/functions/yaad-*; do
            echo "::group::$d"
            deno check "$d/index.ts"
            echo "::endgroup::"
          done

      # Shared modules are copied into each function directory because Supabase
      # deploys self-contained bundles. If a copy drifts from _shared, the thing
      # you tested is not the thing you deployed.
      #
      # The check keys off whether a function actually imports the file, not
      # whether one happens to be sitting there. An early version compared every
      # yaad-* directory against _shared, so yaad-match, which has no otel import
      # and correctly carries no copy, failed every run from the day it was
      # added. Keying off the import also catches the opposite mistake: a stale
      # copy left behind in a function that no longer imports it.
      #
      # Loops over every file in _shared rather than naming otel.ts, so adding a
      # shared module does not mean remembering to extend this job. textmodel.ts
      # was the second one and it decides which country the text model calls go
      # to, which is not a thing to leave unenforced.
      - name: Check the shared module copies are in sync
        run: |
          set -e
          fail=0
          for shared in supabase/functions/_shared/*.ts; do
            name=$(basename "$shared")
            for d in supabase/functions/yaad-*; do
              [ -f "$d/index.ts" ] || continue
              if grep -q "from \"./$name\"" "$d/index.ts"; then
                if [ ! -f "$d/$name" ]; then
                  echo "::error file=$d/index.ts::imports ./$name but no copy is present. Run supabase/functions/sync-shared.sh"
                  fail=1
                elif ! cmp -s "$shared" "$d/$name"; then
                  echo "::error file=$d/$name::$name has drifted from _shared/$name. Run supabase/functions/sync-shared.sh"
                  fail=1
                fi
              elif [ -f "$d/$name" ]; then
                echo "::error file=$d/$name::$name is here but nothing imports it. Delete it, or import it."
                fail=1
              fi
            done
          done
          exit $fail

      # The banned-language screen exists twice, once in Python for the engine
      # and once in Deno for the live functions, because they are two runtimes
      # and the rule has to hold in both. Two copies of a rule drift, so both
      # suites assert the same phrases. If somebody loosens one pattern, one of
      # these two jobs goes red.
      #
      # POINTED AT THE WHOLE TREE, 4 Sep 2026, and that is the point of this
      # step now. It used to read `supabase/functions/_shared/`, which ran ten
      # tests and left forty-eight sitting unenforced next door in yaad-inbound:
      # the Twilio signature check that is the only door in front of four money
      # RPCs, the price guard that stops an invented figure reaching a client,
      # the job-code matcher that decides which job an approval lands on. All
      # forty-eight passed the day they were written and no build has ever
      # depended on them. `deno test` only picks up files matching its own
      # naming convention, so widening the path runs the tests and never an
      # index.ts. Do not narrow this back to one directory: a test nobody runs
      # is documentation, not a control.
      - name: Run the Deno guardrail and Edge Function tests
        run: deno test --allow-read supabase/functions/

      # The provider decision lives in _shared/textmodel.ts and nowhere else.
      # A hard-coded model endpoint in a function is how the estate ended up on
      # eight copies of the same China URL, and how it would quietly drift back.
      - name: No function hard-codes a model endpoint
        run: |
          set -e
          hits=$(grep -rnE 'https://(api\.minimax\.io|api\.mistral\.ai)' \
            supabase/functions/yaad-*/index.ts || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::A text model endpoint is hard-coded in a function. Use pickTextProvider() from _shared/textmodel.ts."
            exit 1
          fi
          echo "No hard-coded text model endpoints."

  web:
    name: Web app (typecheck and tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      # Node 24 on purpose. tests/ import the app's real .ts files and rely on
      # Node stripping the types itself, which older Node cannot do. Drop this
      # below 22.18 and every test fails to parse rather than fails to pass.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Lint runs, as of 3 Sep 2026.
      #
      # This block used to explain why it could not: a pre-existing
      # react-hooks set-state-in-effect error in app/portal/join/page.tsx,
      # which could only be cleared by changing portal behaviour to make an
      # unrelated job go green. That is the right call and it is why lint
      # waited.
      #
      # The description had gone stale. The hooks error is gone; what was
      # actually left was one unescaped apostrophe in QuotePanel.tsx and an
      # unused catch binding in sign-in. Neither changes behaviour, both were
      # fixed in the same commit that added this line, which is exactly the
      # sequence the old comment asked for.
      - name: Lint
        run: npm run lint

      # The tests that matter here are the negative ones: an unsigned, forged or
      # replayed request to /api/hubspot/stage must write NOTHING. That endpoint
      # is what stands between a forged webhook and a deal marked as funded, so
      # these run on every push rather than by hand. No network and no
      # credentials: HubSpot is stubbed.
      - name: Run the web tests
        run: npm test

      # The build DOES run here, with placeholder Supabase values.
      #
      # This used to say a build could not run because check-env.mjs stops one
      # without the Supabase values and this workflow has no reason to hold
      # secrets. The first half is true; the conclusion was not. check-env only
      # asks that the variables are PRESENT, the values are inlined into an
      # artifact this job throws away, and no page queries Supabase at build
      # time (every data route is dynamic, only /, /_not-found and /icon.svg
      # prerender). So placeholders are enough, and they are visibly fake so
      # nobody mistakes them for a leaked key.
      #
      # It earns its place because `tsc --noEmit` does NOT generate Next's route
      # types, and `next build` does. A route-shape mistake, a deleted layout
      # still referenced by a generated validator, a bad generateMetadata
      # signature, all pass typecheck and fail the deploy. That is the gap this
      # closes, and it is the gap that was open on 3 Sep 2026 when a deleted
      # layout left a dangling type reference behind.
      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder_not_a_real_key
        run: npx next build

  taxonomy:
    name: Job taxonomy has not drifted
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # The taxonomy exists in four copies: the generated source, a byte copy
      # the marketing site loads, an inlined copy in the prototype, and a
      # TypeScript restatement the app imports (the app cannot import a file
      # that declares `var`). They agreed when this job was written and nothing
      # kept them agreeing.
      #
      # This matters more than tidiness. The ONLY reason a client's roofing job
      # and a worker's roofing profile find each other is that both came from
      # one list. The day the copies diverge, a client posts a job in a trade no
      # worker profile can carry and the two never meet, with both halves
      # individually valid so nothing else notices. Same idea as the _shared
      # drift check above, for the list the marketplace is built on.
      - name: Check the four copies agree
        run: node scripts/check-taxonomy.mjs

  secrets:
    name: No secrets committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # One API key has already been exposed and rotated on this project. This
      # is a cheap backstop, not a substitute for care.
      - name: Scan tracked files for key-shaped strings
        run: |
          set -e
          # Documentation placeholders (nvapi-xxxxxxxx, <your-key>) are not leaks.
          # Filtering them out is what keeps this check trustworthy: a scanner
          # that cries wolf is a scanner people start ignoring.
          matches=$(git grep -nIE \
            '(sk-[A-Za-z0-9_-]{16,}|nvapi-[A-Za-z0-9_-]{16,}|eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{10,})' \
            -- . ':!.github/workflows/ci.yml' \
            | grep -viE 'x{8,}|<[^>]*>|your[-_ ]?(api[-_ ]?)?(key|token|secret)|placeholder|example|redacted|\.\.\.' || true)
          if [ -n "$matches" ]; then
            echo "$matches"
            echo "::error::A string shaped like an API key or JWT is committed. Rotate it, then remove it."
            exit 1
          fi
          echo "No key-shaped strings found in tracked files."

      # Added 4 Sep 2026. The scan above looks for prefixed key shapes (sk-,
      # nvapi-, JWT). It cannot see a bare hex string, so it walked straight
      # past the notify trigger secret, which is 64 hex characters and was
      # committed as a plaintext literal in two migrations, in a public
      # repository, twice. Rotation fixed the exposure; this step is what
      # stops the third time.
      #
      # The two historical migrations are excluded by path on purpose. They
      # are applied history: editing them would not remove the value from git
      # history and rewriting applied migrations is its own hazard. The value
      # in them is dead. See DECISIONS.md.
      - name: Scan tracked files for bare hex secrets
        run: |
          set -e
          # Real 64-hex values that are NOT secrets: content hashes, lockfile
          # integrity fields, git object ids. Those are filtered by context on
          # the line rather than by path, so a new lockfile does not silently
          # widen the hole.
          matches=$(git grep -nIE "['\"][0-9a-f]{64}['\"]" -- . \
            ':!.github/workflows/ci.yml' \
            ':!**/package-lock.json' \
            ':!**/*.lock' \
            ':!supabase/migrations/20260901g_workers_couldnt_reach_their_own_kickoff_pack.sql' \
            ':!supabase/migrations/20260902c_quote_pack_dual_agreement.sql' \
            | grep -viE 'sha-?256|sha-?512|checksum|integrity|digest|[^a-z]hash|fingerprint|commit|placeholder|example|redacted|x{8,}' || true)
          if [ -n "$matches" ]; then
            echo "$matches"
            echo "::error::A bare 64-character hex literal is committed. If it is a secret, rotate it first, then remove it. If it is a content hash, name it so on the same line (sha256, checksum, digest)."
            exit 1
          fi
          echo "No bare hex secrets found in tracked files."
