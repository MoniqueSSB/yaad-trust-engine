<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- The same mark the marketing site serves as its favicon, so the tab icon
       does not change when somebody crosses from yaadly.co.uk into the app.
       Four of the eight marketing pages were still on the retired teal square
       and the app had no icon at all, so the tab changed three times on the
       way from the home page to a job. Purple #7B4FE0 is the gradient's first
       stop; white Y for contrast. Next serves this at /icon.svg from
       app/icon.svg, no configuration needed. -->
  <rect width="100" height="100" rx="24" fill="#7B4FE0"/>
  <text x="50" y="71" font-family="Arial,Helvetica,sans-serif" font-size="64"
        font-weight="700" text-anchor="middle" fill="#ffffff">Y</text>
</svg>
